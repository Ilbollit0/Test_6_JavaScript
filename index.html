<!doctype html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
    <h1 id="titolo">Le mie cose da fare</h1>

    <form class="aggiunta">
        <input id="nuovo-task" placeholder="Cosa devi fare?" />
        <select id="priorita">
            <option value="bassa">Bassa</option>
            <option value="media">Media</option>
            <option value="alta">Alta</option>
        </select>
        <button id="bottone-aggiungi" type="submit">Aggiungi</button>
    </form>

    <div class="filtri">
        <button class="filtro attivo" data-filtro="tutti">Tutti</button>
        <button class="filtro" data-filtro="attivi">Attivi</button>
        <button class="filtro" data-filtro="completati">Completati</button>
    </div>

    <ul id="lista-task"></ul>

    <p><span id="etichetta">Attivi</span>: <span id="contatore">0</span></p>

    <script src="assets/js/script.js"></script>
</body>

</html>
